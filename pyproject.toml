[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-ai"
version = "1.0.0"
description = "Resume parsing, candidate profiles, and explainable matching and public job discovery for CareerPilot AI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.2,<2.0",
    "pydantic>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
"app" = ["web/*"]
