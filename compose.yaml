# Run with: docker compose up --build -d
# IMPORTANT: This port is published on HOST LOOPBACK ONLY.
# Do NOT replace 127.0.0.1 with 0.0.0.0 or publish via an external proxy.
services:
  careerpilot:
    build: .
    image: careerpilot-ai:1.0.0-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CAREERPILOT_DATA_DIR: /data
      CAREERPILOT_DOCKER_LOCAL: "1"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
      JOB_REMOTIVE_ENABLED: ${JOB_REMOTIVE_ENABLED:-true}
      JOB_GREENHOUSE_BOARDS: ${JOB_GREENHOUSE_BOARDS:-}
      JOB_LEVER_SITES: ${JOB_LEVER_SITES:-}
      JOB_ASHBY_BOARDS: ${JOB_ASHBY_BOARDS:-}
    volumes:
      - careerpilot_local_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m

volumes:
  careerpilot_local_data:
